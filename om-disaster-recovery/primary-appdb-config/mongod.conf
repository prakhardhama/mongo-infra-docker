# mongod.conf - MongoDB configuration file

# Where to store data
storage:
  dbPath: /data/db

# Where to write logging data
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0

# Replication
replication:
  replSetName: appdb-rs
