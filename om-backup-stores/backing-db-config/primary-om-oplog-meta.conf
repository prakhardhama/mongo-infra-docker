# mongod.conf for primary-om-oplog-meta

storage:
  dbPath: /data/db

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27020
  bindIp: 0.0.0.0

replication:
  replSetName: oplog-meta-rs

# Fork so the container's bootstrap script can start mongod and then exec into
# 'tail -f /dev/null' (needed so the container survives the agent stopping
# mongod for an automated restore).
processManagement:
  fork: true
